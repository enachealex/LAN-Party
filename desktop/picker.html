<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- A local page with no network access at all: thumbnails arrive as data: URLs over IPC. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Share your screen</title>
<style>
  :root { color-scheme: dark; --bg: #1e1f22; --panel: #2b2d31; --panel-hover: #35373c; --text: #dbdee1; --muted: #949ba4; --accent: #5865f2; --accent-hover: #4752c4; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; }
  header { padding: 18px 22px 6px; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; color: #f2f3f5; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 6px; padding: 10px 22px 12px; border-bottom: 1px solid rgba(255,255,255,.06); }
  nav button { background: transparent; border: 0; border-radius: 6px; padding: 6px 12px; color: var(--muted); font: inherit; font-weight: 600; cursor: pointer; }
  nav button:hover { background: var(--panel-hover); color: var(--text); }
  nav button[aria-selected="true"] { background: var(--panel); color: #fff; }
  nav .count { margin-left: 6px; padding: 0 6px; border-radius: 8px; background: rgba(255,255,255,.08); font-size: 11.5px; }
  main { flex: 1; overflow: auto; padding: 16px 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; align-content: start; }
  .tile { display: flex; flex-direction: column; gap: 8px; padding: 8px; background: var(--panel); border: 2px solid transparent; border-radius: 10px; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .tile:hover { background: var(--panel-hover); }
  .tile:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .tile[aria-selected="true"] { border-color: var(--accent); background: #323446; }
  .shot { aspect-ratio: 16 / 9; border-radius: 6px; background: #111214; display: grid; place-items: center; overflow: hidden; }
  .shot img { width: 100%; height: 100%; object-fit: contain; }
  .label { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .label img { width: 16px; height: 16px; flex: none; }
  .label span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 13px; }
  .empty { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--muted); }
  footer { display: flex; align-items: center; gap: 10px; padding: 14px 22px; border-top: 1px solid rgba(255,255,255,.06); }
  footer .hint { flex: 1; color: var(--muted); font-size: 12.5px; }
  footer button { border: 0; border-radius: 6px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  #cancel { background: transparent; color: var(--text); }
  #cancel:hover { background: var(--panel-hover); }
  #share { background: var(--accent); color: #fff; }
  #share:hover:not(:disabled) { background: var(--accent-hover); }
  #share:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
  <header>
    <h1>Share your screen</h1>
    <p>Pick a whole screen or a single app window. Only what you pick is shared.</p>
  </header>
  <nav role="tablist" aria-label="What to share">
    <button type="button" role="tab" data-kind="screen" aria-selected="true">Screens<span class="count">0</span></button>
    <button type="button" role="tab" data-kind="window" aria-selected="false">Windows<span class="count">0</span></button>
  </nav>
  <main id="grid" role="listbox" aria-label="Screens and windows you can share"></main>
  <footer>
    <span class="hint">Double-click to share straight away.</span>
    <button type="button" id="cancel">Cancel</button>
    <button type="button" id="share" disabled>Share</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
