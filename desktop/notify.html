<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>LAN Party notifications</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #e6edf5; font-size: 13px; }
  /* Cards stack upward from the bottom edge, just above the taskbar. */
  #stack { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column-reverse; gap: 8px; padding: 8px; }
  .card {
    position: relative; background: #111a24; border: 1px solid rgba(255, 255, 255, .14); border-radius: 12px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .55); padding: 10px 10px 8px; animation: in .2s ease;
  }
  @keyframes in { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  .app { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #8b98a8; margin: 0 0 6px; }
  .app b { color: #c7d2de; font-weight: 700; }
  .body { display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 0 22px 0 0; margin: 0; background: none; border: 0;
    color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 8px; }
  .body:focus-visible { outline: 2px solid #7c5cff; outline-offset: 2px; }
  .avatar { flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff; background: linear-gradient(135deg, #7c5cff, #ff6fae); }
  .text { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .author { font-weight: 800; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where { font-size: 11.5px; color: #8b98a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview { font-size: 13px; line-height: 1.35; color: #d3dde8; margin-top: 2px; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .preview.note { font-style: italic; color: #8b98a8; }
  .close { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; border-radius: 6px; background: none;
    color: #8b98a8; font-size: 12px; cursor: pointer; }
  .close:hover { background: rgba(255, 255, 255, .1); color: #fff; }
  .actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .btn { border-radius: 7px; padding: 5px 12px; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: 1px solid rgba(255, 255, 255, .16); background: rgba(255, 255, 255, .06); color: #e6edf5; }
  .btn:hover:not(:disabled) { background: rgba(255, 255, 255, .12); }
  .btn.primary { border-color: transparent; background: linear-gradient(90deg, #7c5cff, #ff6fae); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .reply { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  textarea { width: 100%; resize: none; min-height: 36px; max-height: 110px; field-sizing: content; padding: 8px 10px; border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, .16); background: #0b1118; color: #e6edf5; font: inherit; font-size: 13.5px; line-height: 1.35; }
  textarea:focus { outline: none; border-color: #7c5cff; }
  .row { display: flex; align-items: center; gap: 6px; }
  .hint { flex: 1; font-size: 11px; color: #8b98a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .error { font-size: 12px; color: #ff8a80; }
  .sent { font-size: 13.5px; font-weight: 700; color: #7ee2a0; padding: 4px 0; }
</style>
</head>
<body>
<div id="stack" role="status" aria-live="polite"></div>
<script src="notify.js"></script>
</body>
</html>
